<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Delver's Hook, drawn in the icon pack's style: thick black silhouette outline, flat colours, a darker lower tone, a white glint -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- outline pass -->
    <rect x="86" y="14" width="112" height="50" rx="22" fill="#000" stroke-width="20"/>
    <path d="M142 64 V78" stroke-width="40"/>
    <circle cx="142" cy="92" r="16" stroke-width="40"/>
    <path d="M142 110 V166 A42 42 0 0 1 58 166 V150" stroke-width="50"/>
    <path d="M58 118 L42 156 L76 156 Z" fill="#000" stroke-width="22"/>
  </g>
  <!-- rope spool -->
  <rect x="86" y="14" width="112" height="50" rx="22" fill="#b7743f"/>
  <rect x="86" y="42" width="112" height="22" rx="11" fill="#8f5428"/>
  <g stroke="#6e3c18" stroke-width="6" stroke-linecap="round">
    <path d="M108 20 V58"/><path d="M128 18 V60"/><path d="M148 18 V60"/><path d="M168 18 V60"/><path d="M186 22 V56"/>
  </g>
  <rect x="98" y="22" width="40" height="10" rx="5" fill="#e3a873"/>
  <!-- rope down to the eye -->
  <path d="M142 62 V80" stroke="#b7743f" stroke-width="14" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="142" cy="92" r="16" fill="none" stroke="#9aa8b6" stroke-width="12"/>
  <path d="M130 86 A14 14 0 0 1 148 78" fill="none" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
  <!-- hook -->
  <path d="M142 110 V166 A42 42 0 0 1 58 166 V150" fill="none" stroke="#7f8d9c" stroke-width="28" stroke-linecap="round"/>
  <path d="M142 110 V166 A42 42 0 0 1 58 166 V150" fill="none" stroke="#b9c6d2" stroke-width="16" stroke-linecap="round" transform="translate(-4,-4)"/>
  <path d="M58 118 L42 156 L76 156 Z" fill="#9aa8b6" stroke="#9aa8b6" stroke-width="4" stroke-linejoin="round"/>
  <path d="M58 124 L50 146" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
  <path d="M134 116 V160" stroke="#f2f6fa" stroke-width="6" stroke-linecap="round"/>
  <!-- a glowing crumb caught on the point -->
  <circle cx="58" cy="114" r="14" fill="#ffd54a" stroke="#000" stroke-width="7"/>
  <circle cx="54" cy="110" r="4" fill="#fff"/>
</svg>
